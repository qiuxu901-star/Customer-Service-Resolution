<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 观澜</title><link rel="stylesheet" href="/auth.css"></head>
<body class="login-page"><main class="login-layout"><section class="login-intro"><a class="auth-brand" href="/">观澜<span>AI客服评测与优化平台</span></a><div><p class="eyebrow">评测 · 分析 · 优化</p><h1>让每一次判断，<br>都有据可循。</h1><p>从真实会话出发，评测AI客服表现，<br>发现问题并验证改进效果。</p></div><span class="intro-foot">工作有进展，判断有依据。</span></section><section class="login-panel"><form id="loginForm" class="login-form"><p class="eyebrow">工作空间</p><h2>登录观澜</h2><p class="muted">使用管理员为你开通的账号登录。</p><label>手机号<input name="phone" type="tel" inputmode="numeric" autocomplete="username" pattern="1[3-9][0-9]{9}" maxlength="11" placeholder="请输入手机号" required autofocus></label><label>密码<input name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="请输入密码" required></label><p id="loginError" class="auth-error" role="alert"></p><button class="auth-primary" type="submit">登录工作空间 <span aria-hidden="true">↗</span></button><details class="forgot-password"><summary>忘记密码？</summary><p>请联系本平台管理员重置密码。拿到临时密码后登录，按提示设置新密码。</p></details><p class="login-note">账号由管理员统一开通，使用手机号和密码登录。</p></form></section></main><script src="/login.js"></script></body></html>
