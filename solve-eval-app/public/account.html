<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的账号 · 观澜</title><link rel="stylesheet" href="/auth.css"></head><body class="account-page"><header class="account-header"><a class="auth-brand" href="/">观澜<span>AI客服评测与优化平台</span></a><div id="authIdentity" class="auth-identity"></div></header><main class="account-main narrow"><a class="back-link" href="/">← 返回工作空间</a><p class="eyebrow">我的账号</p><h1>修改密码</h1><p class="muted" id="passwordHint">定期更新密码，保护工作空间。</p><section class="auth-card"><p id="accountProfile" class="profile-line"></p><form id="passwordForm"><label>当前密码<input name="current_password" type="password" autocomplete="current-password" maxlength="128" required></label><label>新密码<input name="new_password" type="password" autocomplete="new-password" minlength="10" maxlength="128" placeholder="10–128 个字符" required></label><label>再次输入新密码<input name="confirmation" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><p id="passwordError" class="auth-error" role="alert"></p><button class="auth-primary" type="submit">保存新密码并进入工作空间 ↗</button></form></section></main><script src="/auth-client.js"></script><script src="/account.js"></script></body></html>
