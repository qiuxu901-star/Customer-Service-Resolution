<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号管理 · 观澜</title><link rel="stylesheet" href="/auth.css"></head><body class="account-page"><header class="account-header"><a class="auth-brand" href="/">观澜<span>AI客服评测与优化平台</span></a><div id="authIdentity" class="auth-identity"></div></header><main class="account-main"><a class="back-link" href="/">← 返回工作空间</a><div class="accounts-heading"><div><p class="eyebrow">工作空间 / 管理</p><h1>账号管理</h1><p class="muted">统一开通账号、维护人员信息，管理工作空间访问权限。</p></div><button class="auth-primary" id="newAccount">＋ 新建账号</button></div><p id="accountsNotice" role="status" class="accounts-notice"></p><section class="auth-card"><div class="accounts-toolbar"><strong id="accountCount">正在加载账号…</strong><label class="search-label">搜索账号<input id="accountSearch" type="search" placeholder="姓名、手机号或岗位"></label></div><div class="table-scroll"><table class="accounts-table"><thead><tr><th>姓名</th><th>手机号</th><th>岗位</th><th>权限</th><th>状态</th><th>操作</th></tr></thead><tbody id="accountRows"></tbody></table></div><p id="accountsError" class="auth-error" role="alert"></p></section></main><dialog id="accountDialog" aria-labelledby="accountDialogTitle"><form id="accountForm"><div class="dialog-heading"><h2 id="accountDialogTitle">新建账号</h2><button type="button" id="closeAccountDialog" aria-label="关闭">×</button></div><div id="accountFields"></div><p id="accountFormError" class="auth-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancelAccountDialog" class="auth-secondary">取消</button><button type="submit" class="auth-primary" id="saveAccount">保存</button></div></form></dialog><script src="/auth-client.js"></script><script src="/accounts.js"></script></body></html>
